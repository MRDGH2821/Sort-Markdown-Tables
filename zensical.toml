[project]
copyright = """
Copyright &copy; 2026 MRDGH2821
"""
docs_dir = "docs/src"
repo_name = "MRDGH2821/Sort-Markdown-Tables"
repo_url = "https://github.com/MRDGH2821/Sort-Markdown-Tables/"
site_author = "MRDGH2821"
site_description = "Sort your markdown tables"
site_name = "Sort Markdown Tables"
site_url = "https://mrdgh2821.github.io/Sort-Markdown-Tables/"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { class = "mermaid", format = "pymdownx.superfences.fence_code_format", name = "mermaid" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.toc]
permalink = true

[project.theme]
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest"
]
language = "en"

[[project.theme.palette]]
accent = "indigo"
media = "(prefers-color-scheme: light)"
primary = "indigo"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent = "cyan"
media = "(prefers-color-scheme: dark)"
primary = "indigo"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
