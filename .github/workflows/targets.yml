---
jobs:
  build-target:
    continue-on-error: false
    name: Build Target (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.os != 'ubuntu-latest' || matrix.target == 'x86_64-unknown-linux-gnu'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          targets: ${{ matrix.target }}
          toolchain: ${{ matrix.nightly == true && 'nightly' || 'stable' }}
      - if: matrix.os == 'ubuntu-latest' && matrix.target != 'x86_64-unknown-linux-gnu'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.nightly == true && 'nightly' || 'stable' }}
      - if: matrix.os == 'ubuntu-latest' && matrix.target != 'x86_64-unknown-linux-gnu' && matrix.target != 'wasm32-unknown-emscripten'
        name: Install Cross (for non-native targets)
        run: cargo install cross --git https://github.com/cross-rs/cross
      - if: matrix.target == 'wasm32-unknown-emscripten'
        name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
      - if: matrix.target == 'wasm32-unknown-emscripten'
        name: Add wasm32-unknown-emscripten target
        run: rustup target add wasm32-unknown-emscripten
      - if: matrix.os == 'windows-latest' && matrix.target == 'x86_64-pc-windows-gnullvm'
        name: Install LLVM/MinGW (gnullvm linker)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          install: mingw-w64-clang-x86_64-clang
          msystem: CLANG64
          path-type: inherit
          update: true
      - if: matrix.os == 'windows-latest' && matrix.target == 'x86_64-pc-windows-gnullvm'
        name: Add CLANG64 to PATH for gnullvm
        run: echo "C:\msys64\clang64\bin" >> $env:GITHUB_PATH
        shell: pwsh
      - if: matrix.os == 'windows-latest' && matrix.target == 'x86_64-pc-windows-gnullvm'
        name: Create x86_64-w64-mingw32-clang wrapper
        run: Copy-Item "C:\msys64\clang64\bin\clang.exe" "C:\msys64\clang64\bin\x86_64-w64-mingw32-clang.exe"
        shell: pwsh
      - if: matrix.target == 'x86_64-unknown-linux-gnu' || startsWith(matrix.os, 'macos') || startsWith(matrix.os, 'windows')
        name: Build Binary (native)
        run: cargo build --release --target ${{ matrix.target }}
      - if: matrix.target == 'wasm32-unknown-emscripten'
        name: Build Binary (emscripten)
        run: cargo build --release --target ${{ matrix.target }}
      - env:
          RUSTUP_TOOLCHAIN: ${{ matrix.nightly == true && 'nightly' || 'stable' }}
        if: matrix.os == 'ubuntu-latest' && matrix.target != 'x86_64-unknown-linux-gnu' && matrix.target != 'wasm32-unknown-emscripten'
        name: Build Binary (cross)
        run: cross build --release --target ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86 / x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
          - os: ubuntu-latest
            target: i586-unknown-linux-gnu
          - os: ubuntu-latest
            target: i586-unknown-linux-musl
          # Linux ARM & AArch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - nightly: true
            os: ubuntu-latest
            target: aarch64_be-unknown-linux-gnu
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabi
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabi
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
          - os: ubuntu-latest
            target: armv5te-unknown-linux-gnueabi
          - os: ubuntu-latest
            target: armv5te-unknown-linux-musleabi
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabi
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabi
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
          - os: ubuntu-latest
            target: thumbv7neon-unknown-linux-gnueabihf
          # Linux MIPS & MIPS64
          - nightly: true
            os: ubuntu-latest
            target: mips-unknown-linux-gnu
          - nightly: true
            os: ubuntu-latest
            target: mipsel-unknown-linux-gnu
          - nightly: true
            os: ubuntu-latest
            target: mips64-unknown-linux-gnuabi64
          - nightly: true
            os: ubuntu-latest
            target: mips64el-unknown-linux-gnuabi64
          # Linux LoongArch, PowerPC, RISC-V, S390x, SPARC
          - os: ubuntu-latest
            target: loongarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: loongarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: powerpc-unknown-linux-gnu
          - os: ubuntu-latest
            target: powerpc64-unknown-linux-gnu
          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
          - os: ubuntu-latest
            target: sparc64-unknown-linux-gnu
          # Android NDK
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: ubuntu-latest
            target: arm-linux-androideabi
          - os: ubuntu-latest
            target: armv7-linux-androideabi
          - os: ubuntu-latest
            target: i686-linux-android
          - os: ubuntu-latest
            target: thumbv7neon-linux-androideabi
          - os: ubuntu-latest
            target: x86_64-linux-android
          # WebAssembly / Emscripten
          - os: ubuntu-latest
            target: wasm32-unknown-emscripten
          # macOS & iOS
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-ios
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
          - os: ubuntu-latest
            target: i686-pc-windows-gnu
          - os: windows-latest
            target: x86_64-pc-windows-gnullvm
          # BSDs, illumos & Solaris
          - nightly: true
            os: ubuntu-latest
            target: x86_64-unknown-dragonfly
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
          - os: ubuntu-latest
            target: i686-unknown-freebsd
          - os: ubuntu-latest
            target: x86_64-unknown-netbsd
          - os: ubuntu-latest
            target: x86_64-unknown-illumos
          - os: ubuntu-latest
            target: x86_64-pc-solaris
          - os: ubuntu-latest
            target: sparcv9-sun-solaris
name: Target Verification
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
permissions:
  contents: read
