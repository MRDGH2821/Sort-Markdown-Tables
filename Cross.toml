[target.aarch64_be-unknown-linux-gnu]
build-std = ["std", "panic_unwind"]

[target.aarch64_be-unknown-linux-gnu.env]
passthrough = ["RUSTFLAGS=--cfg rustix_use_libc"]

[target.mips-unknown-linux-gnu]
build-std = ["std", "panic_unwind"]

[target.mips64-unknown-linux-gnuabi64]
build-std = ["std", "panic_unwind"]

[target.mips64el-unknown-linux-gnuabi64]
build-std = ["std", "panic_unwind"]

[target.mipsel-unknown-linux-gnu]
build-std = ["std", "panic_unwind"]

# Solaris: libstd and rustix reference XPG4/XNET symbols (__xnet7_socket,
# __sysconf_xpg7, __link_xpg4). These live in libxnet. Do NOT add explicit
# -L paths; the cross-rs sysroot search handles discovery.
[target.sparcv9-sun-solaris.env]
passthrough = ["RUSTFLAGS=-C link-arg=-lxnet"]

[target.x86_64-pc-solaris.env]
passthrough = ["RUSTFLAGS=-C link-arg=-lxnet"]

[target.x86_64-unknown-dragonfly]
build-std = ["std", "panic_unwind"]
