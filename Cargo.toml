[package]
name = "smt"
version = "0.3.1"
edition = "2024"
description = "Sort markdown tables opted-in via HTML comments"
readme = "README.md"
repository = "https://github.com/MRDGH2821/Sort-Markdown-Tables"
license = "GPL-3.0-or-later"
# tombi: format.rules.array-values-order = "ascending"
keywords = ["cli", "markdown", "sort", "table", "utility"]
# tombi: format.rules.array-values-order = "ascending"
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "smt"
path = "src/lib.rs"

[[bin]]
name = "smt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
glob = "0.3.4"
tempfile = "3.27"
thiserror = "2.0.19"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
